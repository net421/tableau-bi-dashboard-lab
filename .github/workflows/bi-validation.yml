name: bi-validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned BI validation runtime
        run: python -m pip install -r requirements.txt
      - name: Rebuild and verify governed BI evidence
        run: make verify
      - name: Upload BI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bi-validation-evidence
          path: |
            data/tableau_ready_exports/
            validation/bi_metric_validation_report.csv
            validation/VALIDATION_SUMMARY.md
            screenshots/
          if-no-files-found: error
